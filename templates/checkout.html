<!DOCTYPE html>
{% load static %}
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Checkout | VASTRIKA</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="{% static 'css/style.css' %}">
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

</head>


<body class="checkout-page">


<nav class="navbar bg-white shadow-sm">

    <div class="container">

        <a href="/"
           class="brand-logo">
            VASTRIKA
        </a>

        <div class="checkout-nav-actions">
            <span class="secure-checkout">
                Secure Checkout <span aria-hidden="true">🔒</span>
            </span>

            <a href="{% url 'home' %}"
               class="checkout-home-button"
               aria-label="Return to the VASTRIKA home page">
                CHECKOUT
                <span class="checkout-home-button__arrow" aria-hidden="true">↗</span>
            </a>
        </div>

    </div>

</nav>


<section class="section-padding">

    <div class="container">

        <div class="section-heading">

            <p>ALMOST THERE</p>

            <h1>Checkout</h1>

        </div>


        <div class="row g-5">


            <!-- CUSTOMER INFORMATION -->

            <div class="col-lg-7">

                <div class="checkout-box">

                    <h4>Delivery Information</h4>

                    <form onsubmit="placeOrder(event)">
                        {% csrf_token %}


                        <div class="row">

                            <div class="col-md-6">

                                <label>First Name</label>

                                <input type="text"
                                name="first_name"
                                       class="form-control"
                                       required>

                            </div>


                            <div class="col-md-6">

                                <label>Last Name</label>

                                <input type="text"
                                name="last_name"
                                       class="form-control"
                                       required>

                            </div>

                        </div>


                        <label>Email</label>

                        <input type="email"
                        name="email"
                               class="form-control"
                               required>


                        <label>Phone Number</label>

                        <input type="tel"
                        name="phone"
                               class="form-control"
                               required>


                        <label>Address</label>

                        <textarea class="form-control"
                                  name="address"
                                  rows="3"
                                  required></textarea>


                        <div class="row">

                            <div class="col-md-4">

                                <label>City</label>

                                <input type="text"
                                name="city"
                                       class="form-control"
                                       required>

                            </div>


                            <div class="col-md-4">

                                <label>State</label>

                                <input type="text"
                                name="state"
                                       class="form-control"
                                       required>

                            </div>


                            <div class="col-md-4">

                                <label>PIN Code</label>

                                <input type="text"
                                name="pin_code"
                                       class="form-control"
                                       required>

                            </div>

                        </div>


                        <button class="btn btn-dark w-100 mt-4">

                            PLACE ORDER

                        </button>


                    </form>

                </div>

            </div>


            <!-- ORDER SUMMARY -->

            <div class="col-lg-5">

                <div class="checkout-summary">

                    <h4>Order Summary</h4>

                    <div id="checkoutItems"></div>

                    <hr>

                    <div class="d-flex justify-content-between">

                        <span>Subtotal</span>

                        <span id="checkoutSubtotal">
                            ₹0
                        </span>

                    </div>


                    <div class="d-flex justify-content-between">

                        <span>Shipping</span>

                        <span id="checkoutShipping">₹0</span>

                    </div>


                    <hr>


                    <div class="d-flex justify-content-between">

                        <strong>Total</strong>

                        <strong id="checkoutTotal">
                            ₹100
                        </strong>

                    </div>

                </div>

            </div>

        </div>

    </div>

</section>


<script>
    window.RAZORPAY_KEY_ID = '{{ razorpay_key_id|escapejs }}';
</script>
<script src="{% static 'js/script.js' %}?v=3"></script>

</body>
</html>
