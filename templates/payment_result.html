<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment | VASTRIKA</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <main class="payment-result">
        <p class="section-heading__eyebrow">VASTRIKA CHECKOUT</p>
        <h1>{% if success %}Payment Successful{% else %}Payment Not Completed{% endif %}</h1>
        <p>{{ message }}</p>
        {% if payment_id %}
            <small>Payment ID: {{ payment_id }}</small>
        {% endif %}
        <a class="btn btn-dark" href="{% url 'home' %}">CONTINUE SHOPPING</a>
    </main>
</body>
</html>
